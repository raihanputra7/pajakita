<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kursor Ondi - efek klik</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#F1E9DA;color:#2b2420;min-height:100vh;display:grid;place-items:center}
  main{text-align:center;padding:24px}
  button{font:inherit;padding:12px 22px;margin:6px;border:0;border-radius:10px;background:#1F7A5A;color:#fff;cursor:pointer}
  button.merah{background:#B71C1C}

  /* ===== KURSOR ONDI (salin bagian CSS ini) ===== */
  @media (pointer:fine){ html, html * { cursor:none !important; } }
  #ondi-kursor{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;
    pointer-events:none;z-index:2147483647;display:none;will-change:transform;overflow:visible}
  #ondi-kursor.aktif{display:block}
  #ondi-kursor svg{width:100%;height:100%;overflow:visible}
  #ondi-kursor .mata-tutup{opacity:0}
  #ondi-kursor .sinar{stroke:#231F1F;stroke-width:14;stroke-linecap:round;opacity:0}
  /* 1 klik = 1x animasi */
  #ondi-kursor.klik svg{animation:ondi-pop .26s ease-out}
  #ondi-kursor.klik .mata-buka{animation:ondi-buka .26s steps(1,end)}
  #ondi-kursor.klik .mata-tutup{animation:ondi-tutup .26s steps(1,end)}
  #ondi-kursor.klik .sinar{animation:ondi-sinar .42s ease-out}
  @keyframes ondi-pop{0%{transform:scale(1)}30%{transform:scale(.88)}100%{transform:scale(1)}}
  @keyframes ondi-buka{0%{opacity:0}85%{opacity:1}100%{opacity:1}}
  @keyframes ondi-tutup{0%{opacity:1}85%{opacity:0}100%{opacity:0}}
  @keyframes ondi-sinar{0%{opacity:1;transform:translate(0,0)}
    100%{opacity:0;transform:translate(calc(var(--dx)*26px),calc(var(--dy)*26px))}}
  @media (prefers-reduced-motion:reduce){
    #ondi-kursor.klik svg,#ondi-kursor.klik .sinar{animation:none}
  }
</style>
</head>
<body>
<main>
  <h1>Kursor Ondi</h1>
  <p>Gerakkan mouse dan klik di mana saja: Ondi berkedip dan garis keluar dari kepalanya.</p>
  <button>Tombol hijau</button><button class="merah">Tombol merah</button>
</main>

<!-- ===== KURSOR ONDI (salin elemen ini ke sebelum </body>) ===== -->
<div id="ondi-kursor" aria-hidden="true">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="117.5 235 345 345">
<defs><filter id="kontur" x="-10%" y="-10%" width="120%" height="120%"><feMorphology in="SourceAlpha" operator="dilate" radius="6" result="tebal"/><feFlood flood-color="#FFFFFF" result="putih"/><feComposite in="putih" in2="tebal" operator="in" result="kontur"/><feMerge><feMergeNode in="kontur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g filter="url(#kontur)"><g id="kepala"><line x1="290" y1="395" x2="290" y2="257" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="276" y1="395" x2="236" y2="285" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="304" y1="395" x2="344" y2="285" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="258" y1="395" x2="207" y2="327" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="322" y1="395" x2="373" y2="327" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="240" y1="393" x2="195" y2="378" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><line x1="340" y1="393" x2="385" y2="378" stroke="#E0A526" stroke-width="27" stroke-linecap="round"/><path d="M203,440 V400 H377 V440 V510 Q377,572 290,572 Q203,572 203,510 Z" fill="#B71C1C"/><path d="M203,411 V393 Q203,385 211,385 H369 Q377,385 377,393 V411 Z" fill="#E0A526"/><path d="M203,410 L217.5,428 L232,410 L246.5,428 L261,410 L275.5,428 L290,410 L304.5,428 L319,410 L333.5,428 L348,410 L362.5,428 L377,410 Z" fill="#E0A526"/><path d="M203,410 L217.5,428 L232,410 L246.5,428 L261,410 L275.5,428 L290,410 L304.5,428 L319,410 L333.5,428 L348,410 L362.5,428 L377,410 Z" fill="#E0A526"/><line x1="226" y1="438" x2="280" y2="438" stroke="#231F1F" stroke-width="9" stroke-linecap="round"/><line x1="300" y1="438" x2="354" y2="438" stroke="#231F1F" stroke-width="9" stroke-linecap="round"/><g class="mata-buka"><circle cx="254" cy="476" r="22" fill="#fff"/><circle cx="254" cy="476" r="11" fill="#231F1F"/><circle cx="326" cy="476" r="22" fill="#fff"/><circle cx="326" cy="476" r="11" fill="#231F1F"/></g><g class="mata-tutup"><path d="M231,476 Q254,490 277,476" fill="none" stroke="#231F1F" stroke-width="8" stroke-linecap="round"/><path d="M303,476 Q326,490 349,476" fill="none" stroke="#231F1F" stroke-width="8" stroke-linecap="round"/></g><path d="M243,532 Q245,518 270,517 Q282,517 290,522 Q298,517 310,517 Q335,518 337,532 Q316,526 290,530 Q264,526 243,532 Z" fill="#231F1F"/><path d="M264,547 Q290,561 316,547" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><line class="sinar" style="--dx:-1;--dy:-0.7" x1="178" y1="350" x2="142" y2="324"/><line class="sinar" style="--dx:-1;--dy:-0.1" x1="184" y1="436" x2="140" y2="432"/><line class="sinar" style="--dx:-0.9;--dy:0.6" x1="190" y1="510" x2="152" y2="532"/><line class="sinar" style="--dx:1;--dy:-0.7" x1="402" y1="350" x2="438" y2="324"/><line class="sinar" style="--dx:1;--dy:-0.1" x1="396" y1="436" x2="440" y2="432"/><line class="sinar" style="--dx:0.9;--dy:0.6" x1="390" y1="510" x2="428" y2="532"/></g>
</svg>
</div>

<script>
/* ===== KURSOR ONDI (salin script ini) ===== */
(function(){
  if(!window.matchMedia('(pointer:fine)').matches) return;   // tidak aktif di layar sentuh
  var k=document.getElementById('ondi-kursor'),svg=k.querySelector('svg'),t;
  document.addEventListener('mousemove',function(e){
    k.classList.add('aktif');
    k.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
  },{passive:true});
  document.addEventListener('mouseleave',function(){k.classList.remove('aktif')});
  document.addEventListener('mousedown',function(){
    k.classList.remove('klik'); void svg.getBoundingClientRect();   // mulai ulang animasi tiap klik
    k.classList.add('klik');
    clearTimeout(t); t=setTimeout(function(){k.classList.remove('klik')},450);
  });
})();
</script>
</body>
</html>
